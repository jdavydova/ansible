---
- name: Install Docker
  hosts: all
  become: yes
  tasks:
    - name: Install Docker
      yum:
        name: docker
        update_cache: yes
        state: present
    - name: Start docker daemon
      systemd:
        name: docker
        state: started

- name: Create new linux user
  hosts: all
  become: yes
  vars_files:
    - project-vars
  roles:
    - create_user

- name: Install Docker-compose
  hosts: all
  become: yes
  tasks:
    - name: Create docker-compose directory
      file:
        path: /home/julia/.docker/cli-plugins
        state: directory
        owner: julia
        group: julia
        mode: "0755"

    - name: Get architecture of remote machine
      shell: uname -m
      register: remote_arch

    - name: Install docker-compose
      get_url:
        url: "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-{{remote_arch.stdout}}"
        dest: /home/julia/.docker/cli-plugins/docker-compose
        owner: julia
        group: julia
        mode: "0755"

- name: Start docker containers
  hosts: all
  become: yes
  become_user: julia
  vars_files:
    - project-vars
  roles:
    - start_containers
