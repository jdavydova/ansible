---
- name: Deploy app in new namespace
  hosts: localhost
  tasks:
    - name: Create k8s namespace
      kubernetes.core.k8s:
        name: my-app
        api_version: v1
        kind: Namespace
        state: present
        kubeconfig: /Users/juliadavydova/terraform/kubeconfig_myapp-eks-cluster
    - name: Deploy nginx app
      kubernetes.core.k8s:
        src: ~/nana-projects/demo-project/k8s-files/nginx-config.yaml
        state: present
        kubeconfig: /Users/juliadavydova/terraform/kubeconfig_myapp-eks-cluster
        namespace: my-app