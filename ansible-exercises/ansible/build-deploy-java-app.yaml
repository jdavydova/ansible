---
- name: Build Java application locally
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Build application with Gradle
      ansible.builtin.command: gradle build
      args:
        chdir: "{{ playbook_dir }}/.."


- name: Deploy Java application
  hosts: app_server
  become: true

  vars:
    app_dir: "/home/{{ linux_user }}/app"
    jar_name: "java-app.jar"

  roles:
    - create_user
    - install_java

  tasks:
    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ linux_user }}"
        group: "{{ linux_user }}"
        mode: "0755"

    - name: Stop old application
      ansible.builtin.shell: |
        if [ -f "{{ app_dir }}/app.pid" ]; then
          kill "$(cat {{ app_dir }}/app.pid)" || true
          rm -f "{{ app_dir }}/app.pid"
        fi
      changed_when: false
      failed_when: false

    - name: Remove old jar
      ansible.builtin.file:
        path: "{{ app_dir }}/{{ jar_name }}"
        state: absent

    - name: Copy new jar
      vars:
        app_dir: "/home/{{ linux_user }}/app"
        local_jar: "{{ playbook_dir }}/../build/libs/java-app-1.0-SNAPSHOT.jar"
        jar_name: "java-app.jar"
      ansible.builtin.copy:
        src: "{{ local_jar }}"
        dest: "{{ app_dir }}/{{ jar_name }}"
        owner: "{{ linux_user }}"
        group: "{{ linux_user }}"
        mode: "0755"

    - name: Start Java application
      become_user: "{{ linux_user }}"
      ansible.builtin.shell: |
        nohup java -jar "{{ app_dir }}/{{ jar_name }}" \
          > "{{ app_dir }}/app.log" 2>&1 &
        echo $! > "{{ app_dir }}/app.pid"
      args:
        chdir: "{{ app_dir }}"