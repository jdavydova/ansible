---
- name: Destroy Exercise 6 infrastructure
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    region: eu-north-1

  tasks:
    - name: Find VPC
      amazon.aws.ec2_vpc_net_info:
        region: "{{ region }}"
        filters:
          "tag:Name": exercise-6-vpc
      register: vpc_info

    - name: Validate Exercise 6 VPC
      ansible.builtin.assert:
        that:
          - vpc_info.vpcs | length <= 1
        fail_msg: "Multiple Exercise 6 VPCs found. Aborting cleanup."

    - name: Find Web server
      amazon.aws.ec2_instance_info:
        region: "{{ region }}"
        filters:
          "tag:Name": web-server
          "tag:Project": ansible-exercise-6
      register: web_info

    - name: Find DB server
      amazon.aws.ec2_instance_info:
        region: "{{ region }}"
        filters:
          "tag:Name": db-server
          "tag:Project": ansible-exercise-6
      register: db_info

    - name: Find Ansible control server
      amazon.aws.ec2_instance_info:
        region: "{{ region }}"
        filters:
          "tag:Name": ansible-control-plane
          "tag:Project": ansible-exercise-6
      register: ansible_info

    - name: Terminate Web server
      amazon.aws.ec2_instance:
        region: "{{ region }}"
        instance_ids: "{{ web_info.instances | map(attribute='instance_id') | list }}"
        state: absent
        wait: true
      when: web_info.instances | length > 0

    - name: Terminate DB server
      amazon.aws.ec2_instance:
        region: "{{ region }}"
        instance_ids: "{{ db_info.instances | map(attribute='instance_id') | list }}"
        state: absent
        wait: true
      when: db_info.instances | length > 0

    - name: Terminate Ansible control server
      amazon.aws.ec2_instance:
        region: "{{ region }}"
        instance_ids: "{{ ansible_info.instances | map(attribute='instance_id') | list }}"
        state: absent
        wait: true
      when: ansible_info.instances | length > 0

    - name: Find NAT Gateway
      amazon.aws.ec2_vpc_nat_gateway_info:
        region: "{{ region }}"
        filters:
          "tag:Name": exercise-6-nat-gateway
      register: nat_info

    - name: Delete NAT Gateway
      amazon.aws.ec2_vpc_nat_gateway:
        region: "{{ region }}"
        nat_gateway_id: "{{ item.nat_gateway_id }}"
        state: absent
        wait: true
      loop: "{{ nat_info.result }}"
      when: nat_info.result | length > 0

    - name: Find Elastic IP
      amazon.aws.ec2_eip_info:
        region: "{{ region }}"
        filters:
          "tag:Name": exercise-6-nat-eip
      register: eip_info

    - name: Release Elastic IP
      amazon.aws.ec2_eip:
        region: "{{ region }}"
        public_ip: "{{ item.public_ip }}"
        state: absent
      loop: "{{ eip_info.addresses }}"
      when: eip_info.addresses | length > 0

    - name: Delete DB Security Group
      amazon.aws.ec2_security_group:
        name: db-server-sg
        region: "{{ region }}"
        vpc_id: "{{ vpc_info.vpcs[0].vpc_id }}"
        state: absent
      when: vpc_info.vpcs | length > 0

    - name: Delete Web Security Group
      amazon.aws.ec2_security_group:
        name: web-server-sg
        region: "{{ region }}"
        vpc_id: "{{ vpc_info.vpcs[0].vpc_id }}"
        state: absent
      when: vpc_info.vpcs | length > 0

    - name: Delete Ansible control Security Group
      amazon.aws.ec2_security_group:
        name: ansible-control-sg
        region: "{{ region }}"
        vpc_id: "{{ vpc_info.vpcs[0].vpc_id }}"
        state: absent
      when: vpc_info.vpcs | length > 0

    - name: Delete public subnet
      amazon.aws.ec2_vpc_subnet:
        region: "{{ region }}"
        vpc_id: "{{ vpc_info.vpcs[0].vpc_id }}"
        cidr: 10.0.1.0/24
        state: absent
      when: vpc_info.vpcs | length > 0

    - name: Delete private subnet
      amazon.aws.ec2_vpc_subnet:
        region: "{{ region }}"
        vpc_id: "{{ vpc_info.vpcs[0].vpc_id }}"
        cidr: 10.0.2.0/24
        state: absent
      when: vpc_info.vpcs | length > 0

    - name: Find Exercise 6 route tables
      amazon.aws.ec2_vpc_route_table_info:
        region: "{{ region }}"
        filters:
          vpc-id: "{{ vpc_info.vpcs[0].vpc_id }}"
      register: route_tables_info
      when: vpc_info.vpcs | length > 0

    - name: Delete Exercise 6 route tables
      amazon.aws.ec2_vpc_route_table:
        region: "{{ region }}"
        vpc_id: "{{ vpc_info.vpcs[0].vpc_id }}"
        route_table_id: "{{ item.id }}"
        lookup: id
        state: absent
      loop: >-
        {{
          route_tables_info.route_tables | default([])
          | selectattr('tags.Name', 'defined')
          | selectattr('tags.Name', 'in',
              ['exercise-6-public-rt', 'exercise-6-private-rt'])
          | list
        }}
      when: vpc_info.vpcs | length > 0

    - name: Delete Internet Gateway
      amazon.aws.ec2_vpc_igw:
        region: "{{ region }}"
        vpc_id: "{{ vpc_info.vpcs[0].vpc_id }}"
        state: absent
      when: vpc_info.vpcs | length > 0

    - name: Delete VPC
      amazon.aws.ec2_vpc_net:
        name: exercise-6-vpc
        cidr_block: 10.0.0.0/16
        region: "{{ region }}"
        state: absent
      when: vpc_info.vpcs | length > 0
