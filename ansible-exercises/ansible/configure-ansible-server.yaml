---
- name: Configure Ansible control server
  hosts: ansible_control
  become: true

  tasks:
    - name: Install required package
      ansible.builtin.apt:
        name:
          - ansible
          - python3
          - python3-pip
          - git
        state: present
        update_cache: true

    - name: Install AWS python libraries
      ansible.builtin.apt:
        name:
          - python3-boto3
          - python3-botocore
        state: present
        update_cache: true

    - name: Install amazon.aws collection
      become: false
      ansible.builtin.command:
        cmd: ansible-galaxy collection install amazon.aws
      changed_when: false

    - name: Create Ansible project directory
      ansible.builtin.file:
        path: /home/ubuntu/ansible-project
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Copy Ansible project
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/"
        dest: /home/ubuntu/ansible-project/
        owner: ubuntu
        group: ubuntu
        mode: preserve