---
- name: Provision Ansible control Server
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Create Ansible control server
      amazon.aws.ec2_instance:
        name: ansible-control-plane
        key_name: ansible-jenkins
        instance_type: t3.micro
        image_id: ami-0aba19e56f3eaec05
        region: eu-north-1
        vpc_subnet_id: subnet-0040a19a99d2c01ed
        network:
          assign_public_ip: true
        wait: true
      register: ansible_server

    - name: Show Ansible server public IP
      ansible.builtin.debug:
        msg: "{{ ansible_server.instances[0].public_ip_address }}"
