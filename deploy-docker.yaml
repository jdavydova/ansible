---
- name: Install Docker
  hosts: docker_server
  become: yes
  tasks:
    - name: Install Docker
      yum:
        name: docker
        update_cache: yes
        state: present

- name: Install Docker-compose
  hosts: docker_server
  tasks:
    - name: Create docker-compose directory
      file:
        path: ~/.docker/cli-plugins
        state: directory

    - name: get arhitecture of remote machine
      shell: uname -m
      register: remote_arch
    - name: Install docker-compose
      get_url:
        url: https://github.com/docker/compose/releases/latest/download/docker-compose-linux-{{ remote_arch.stdout }}
        dest: ~/.docker/cli-plugins/docker-compose
        mode: +x

- name: Start Docker
  hosts: docker_server
  become: yes
  tasks:
    - name: Ensure docker is running
      systemd:
        name: docker
        state: start

- name: Add ec2-user to docker group
  hosts: docker_server
  become: yes
  tasks:
    - name: Add ec2-user to docker group
      user:
        name: ec2-user
        group: docker
        append: yes
    - name: Reconnect to server session
      meta: reset_connection

- name: Start docker container
  hosts: docker_server
  vars_files:
  tasks:
    - name: Copy docker compose
      copy:
        src: /Users/juliadavydova/nana-projects/bootcamp-java-mysql-project
        dest: /home/ec2-user/docker-compose.yaml
    - name: Docker login
      docker_login:
        user_name: juliadavydova
        password: "{{password}}"
    - name: Start container from compose
      community.docker.docker_compose_v2:
        project_src: /home/ec2-user




