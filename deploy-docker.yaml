---
- name: Install Docker
  hosts: docker_server
  become: yes
  tasks:
    - name: Install Docker
      yum:
        name: docker
        update_cache: yes
        state: present

- name: Install Docker-compose
  hosts: docker_server
  tasks:
    - name: Create docker-compose directory
      file:
        path: ~/.docker/cli-plugins
        state: directory

    - name: get arhitecture of remote machine
      shell: uname -m
      register: remote_arch
    - name: Install docker-compose
      get_url: https://github.com/docker/compose/releases/latest/download/docker-compose-linux-{{ remote_arch.stdout }}
      dest: ~/.docker/cli-plugins/docker-compose
      mode: +x

- name: Start Docker
  hosts: docker_server
  become: yes
  tasks:
    - name: Ensure docker is running
      systemd:
        name: docker
        state: start

- name: Add ec2-user to docker group
  hosts: docker_server
  become: yes
  tasks:
    - name: Add ec2-user to docker group
      user:
        name: ec2-user
        group: docker
        append: yes
    - name: Reconnect to server session
      meta: reset_connection

- name: Start docker container
  hosts: docker_server
  tasks:
    - name: Copy docker compose
      copy:
        src:
        dest:



