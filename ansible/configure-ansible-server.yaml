---
- name: Configure Ansible control server
  hosts: ansible_control
  become: true

  tasks:
    - name: Install required package
      ansible.builtin.apt:
        name:
          - ansible
          - python3
          - python3-pip
          - git
        state: present
        update_cache: true

    - name: Create Ansible project directory
      ansible.builtin.file:
        path: /home/ubuntu/ansible-project
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Copy Ansible project
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/"
        dest: /home/ubuntu/ansible-project/
        owner: ubuntu
        group: ubuntu
        mode: preserve
        decrypt: false

    - name: Install Ansible Galaxy roles
      ansible.builtin.command:
        cmd: ansible-galaxy role install -r requirements.yaml
        chdir: /home/ubuntu/ansible-project
      become_user: ubuntu

    - name: Install Ansible Galaxy collections
      ansible.builtin.command:
        cmd: ansible-galaxy collection install -r requirements.yaml
        chdir: /home/ubuntu/ansible-project
      become_user: ubuntu