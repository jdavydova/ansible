---
- name: Configure MySQL database server
  hosts: db_server
  become: true

  vars_files:
    - vars/project-vars.yaml
    - vars/secrets.yaml

  vars:
    mysql_bind_address: "0.0.0.0"
    mysql_databases:
      - name: "{{ db_name }}"

    mysql_users: []

  pre_tasks:
      - name: Wait for DB server SSH connection
        ansible.builtin.wait_for_connection:
          timeout: 180
          sleep: 5
      - name: Gather DB server facts
        ansible.builtin.setup:

  roles:
    - geerlingguy.mysql

  tasks:
    - name: Create application MySQL user
      ansible.mysql.mysql_user:
        name: "{{ db_user }}"
        host: "%"
        password: "{{ db_password }}"
        priv: "{{ db_name }}.*:ALL"
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock
      no_log: true

- name: Configure Web server
  hosts: web_server
  become: true
  gather_facts: false

  vars_files:
    - vars/project-vars.yaml
    - vars/secrets.yaml

  pre_tasks:
    - name: Wait for Web server SSH connection
      ansible.builtin.wait_for_connection:
        timeout: 180
        sleep: 5

    - name: Gather Web server facts
      ansible.builtin.setup:

  roles:
    - create_user
    - install_java

  tasks:
    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ linux_user }}"
        group: "{{ linux_user }}"
        mode: "0755"

    - name: Copy Java application
      ansible.builtin.copy:
        src: "{{ local_jar }}"
        dest: "{{ app_dir }}/{{ jar_name }}"
        owner: "{{ linux_user }}"
        group: "{{ linux_user }}"
        mode: "0644"

    - name: Create secure application environment file
      ansible.builtin.copy:
        dest: /etc/java-app.env
        owner: root
        group: root
        mode: "0600"
        content: |
          DB_SERVER={{ hostvars[groups['db_server'][0]].ansible_host }}
          DB_PORT={{ db_port }}
          DB_NAME={{ db_name }}
          DB_USER={{ db_user }}
          DB_PASSWORD={{ db_password }}
      no_log: true

    - name: Create systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/java-app.service
        mode: "0644"
        content: |
          [Unit]
          Description=Java Application
          After=network.target
          
          [Service]
          User={{ linux_user }}
          WorkingDirectory={{ app_dir }}
          EnvironmentFile=/etc/java-app.env
         
          ExecStart=/usr/bin/java -jar {{ app_dir }}/{{ jar_name }}
          
          Restart=always
          RestartSec=5
          
          [Install]
          WantedBy=multi-user.target

    - name: Start and enable Java application
      ansible.builtin.systemd:
        name: java-app
        state: restarted
        enabled: true
        daemon_reload: true